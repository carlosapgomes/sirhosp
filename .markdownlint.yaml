# Configuração compartilhada do markdownlint para editor e CLI.
#
# Este arquivo contém as regras do markdownlint core e deve ser usado por
# integrações de editor (ex.: extensão Markdownlint do VS Code). O wrapper
# CLI2 do projeto usa a mesma configuração, espelhada em
# `.markdownlint-cli2.yaml`, para evitar divergência entre editor e validação
# oficial.

# Ativar todas as regras default.
default: true

# MD013/line-length — desabilitada (restauração da política compatível
# anterior a 10/06/2026). Justificativa: documentos técnicos em português,
# tabelas, URLs e paths frequentemente excedem 80 colunas; requebrar 1610
# linhas históricas não adiciona segurança ou correção; arquivos em
# `apps/summaries/prompts/` são payloads de LLM que não podem ser
# reformatados. As demais regras permanecem ativas e comentários
# `markdownlint-disable` continuam proibidos.
MD013: false

# MD041/first-line-heading — desabilitada pela mesma política: specs delta
# OpenSpec podem começar em H2 por convenção e payloads de prompt LLM não
# devem ganhar H1 sintético que altere o texto enviado ao modelo.
MD041: false

# MD033/no-inline-html — permitido para diagramas ASCII em code blocks e
# templates (ex: ADR template com placeholders).
MD033: false

# MD032/blanks-around-lists — desabilitado porque o projeto contém arquivos .md
# que são textos de prompt LLM (apps/summaries/prompts/); adicionar blank lines
# pode alterar o conteúdo enviado ao modelo.
MD032: false
