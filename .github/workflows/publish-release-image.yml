name: Publish Release Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact Git tag to publish
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Resolve validated release commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          commit_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test -n "${commit_sha}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Ensure quality gate is executable
        run: chmod +x ./scripts/test-in-container.sh

      - name: Run official quality gate
        run: ./scripts/test-in-container.sh quality-gate

  publish:
    needs: validate
    name: Publish immutable production release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify release tag still resolves to validated commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test "${tag_commit}" = "${VALIDATED_COMMIT}"

      - name: Require immutable GitHub releases
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          enabled="$(
            gh api \
              "repos/${{ github.repository }}/immutable-releases" \
              --jq .enabled
          )"
          test "${enabled}" = "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing exact image tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          exact_image="ghcr.io/${{ github.repository }}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "${exact_image}" >/dev/null 2>&1; then
            echo "exact image tag already exists: ${exact_image}" >&2
            exit 1
          fi

      - name: Create draft release with standalone Compose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          UPGRADE_ASSET="docs/releases/${RELEASE_TAG}-upgrade.md"
          test -f "${UPGRADE_ASSET}"
          release_args=(
            --verify-tag
            --draft
            --generate-notes
            --title "SIRHOSP ${RELEASE_TAG}"
          )
          if [[ "${IS_PRERELEASE}" = "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" compose.hospital.yml "${UPGRADE_ASSET}" \
            "${release_args[@]}"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest,enable=${{ inputs.prerelease == false }}
            type=raw,value=prerelease,enable=${{ inputs.prerelease == true }}
          labels: |
            org.opencontainers.image.title=SIRHOSP
            org.opencontainers.image.description=SIRHOSP production runtime
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          immutable="$(
            gh api \
              "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
              --jq .immutable
          )"
          test "${immutable}" = "true"
