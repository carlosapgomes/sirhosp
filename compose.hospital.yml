# Standalone production stack for the server inside the hospital.
# Requires only this file, a host-local .env, Docker Engine and Docker Compose.
name: sirhosp

x-app-environment: &app-environment
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}"
  POSTGRES_DB: "${POSTGRES_DB:-sirhosp}"
  POSTGRES_USER: "${POSTGRES_USER:-sirhosp}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  SOURCE_SYSTEM_URL: "${SOURCE_SYSTEM_URL:?Set SOURCE_SYSTEM_URL}"
  SOURCE_SYSTEM_USERNAME: "${SOURCE_SYSTEM_USERNAME:?Set SOURCE_SYSTEM_USERNAME}"
  SOURCE_SYSTEM_PASSWORD: "${SOURCE_SYSTEM_PASSWORD:?Set SOURCE_SYSTEM_PASSWORD}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
  LLM_MODEL: "${LLM_MODEL:-gpt-4o}"
  LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-120}"
  SUMMARY_PHASE1_PROVIDER: "${SUMMARY_PHASE1_PROVIDER:-}"
  SUMMARY_PHASE1_MODEL: "${SUMMARY_PHASE1_MODEL:-}"
  SUMMARY_PHASE1_BASE_URL: "${SUMMARY_PHASE1_BASE_URL:-}"
  SUMMARY_PHASE1_API_KEY: "${SUMMARY_PHASE1_API_KEY:-}"
  SUMMARY_PHASE2_OPTION_1_LABEL: "${SUMMARY_PHASE2_OPTION_1_LABEL:-}"
  SUMMARY_PHASE2_OPTION_1_PROVIDER: "${SUMMARY_PHASE2_OPTION_1_PROVIDER:-}"
  SUMMARY_PHASE2_OPTION_1_MODEL: "${SUMMARY_PHASE2_OPTION_1_MODEL:-}"
  SUMMARY_PHASE2_OPTION_1_BASE_URL: "${SUMMARY_PHASE2_OPTION_1_BASE_URL:-}"
  SUMMARY_PHASE2_OPTION_1_API_KEY: "${SUMMARY_PHASE2_OPTION_1_API_KEY:-}"
  SUMMARY_PHASE2_OPTION_1_ENABLED: "${SUMMARY_PHASE2_OPTION_1_ENABLED:-false}"
  SUMMARY_PHASE2_OPTION_2_LABEL: "${SUMMARY_PHASE2_OPTION_2_LABEL:-}"
  SUMMARY_PHASE2_OPTION_2_PROVIDER: "${SUMMARY_PHASE2_OPTION_2_PROVIDER:-}"
  SUMMARY_PHASE2_OPTION_2_MODEL: "${SUMMARY_PHASE2_OPTION_2_MODEL:-}"
  SUMMARY_PHASE2_OPTION_2_BASE_URL: "${SUMMARY_PHASE2_OPTION_2_BASE_URL:-}"
  SUMMARY_PHASE2_OPTION_2_API_KEY: "${SUMMARY_PHASE2_OPTION_2_API_KEY:-}"
  SUMMARY_PHASE2_OPTION_2_ENABLED: "${SUMMARY_PHASE2_OPTION_2_ENABLED:-false}"
  SUMMARY_PHASE2_OPTION_3_LABEL: "${SUMMARY_PHASE2_OPTION_3_LABEL:-}"
  SUMMARY_PHASE2_OPTION_3_PROVIDER: "${SUMMARY_PHASE2_OPTION_3_PROVIDER:-}"
  SUMMARY_PHASE2_OPTION_3_MODEL: "${SUMMARY_PHASE2_OPTION_3_MODEL:-}"
  SUMMARY_PHASE2_OPTION_3_BASE_URL: "${SUMMARY_PHASE2_OPTION_3_BASE_URL:-}"
  SUMMARY_PHASE2_OPTION_3_API_KEY: "${SUMMARY_PHASE2_OPTION_3_API_KEY:-}"
  SUMMARY_PHASE2_OPTION_3_ENABLED: "${SUMMARY_PHASE2_OPTION_3_ENABLED:-false}"
  SUMMARY_PHASE2_OPTION_4_LABEL: "${SUMMARY_PHASE2_OPTION_4_LABEL:-}"
  SUMMARY_PHASE2_OPTION_4_PROVIDER: "${SUMMARY_PHASE2_OPTION_4_PROVIDER:-}"
  SUMMARY_PHASE2_OPTION_4_MODEL: "${SUMMARY_PHASE2_OPTION_4_MODEL:-}"
  SUMMARY_PHASE2_OPTION_4_BASE_URL: "${SUMMARY_PHASE2_OPTION_4_BASE_URL:-}"
  SUMMARY_PHASE2_OPTION_4_API_KEY: "${SUMMARY_PHASE2_OPTION_4_API_KEY:-}"
  SUMMARY_PHASE2_OPTION_4_ENABLED: "${SUMMARY_PHASE2_OPTION_4_ENABLED:-false}"
  UV_PROJECT_ENVIRONMENT: /opt/venv
  UV_CACHE_DIR: /opt/.uv_cache
  UV_NO_CACHE: "1"
  TMPDIR: /tmp
  TEMP: /tmp
  TMP: /tmp
  XDG_CACHE_HOME: /tmp/xdg-cache
  XDG_CONFIG_HOME: /tmp/xdg-config

x-app-service: &app-service
  image: ghcr.io/carlosapgomes/sirhosp:${SIRHOSP_VERSION:?Set SIRHOSP_VERSION to an exact release tag}
  init: true
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    db:
      condition: service_healthy
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-playwright-service: &playwright-service
  <<: *app-service
  shm_size: "${PLAYWRIGHT_SHM_SIZE:-512m}"
  tmpfs:
    - "/tmp:size=${PLAYWRIGHT_TMPFS_TMP_SIZE:-1g},mode=1777"
    - "/var/tmp:size=${PLAYWRIGHT_TMPFS_VAR_TMP_SIZE:-128m},mode=1777"
    - "/home/10001/.cache:size=${PLAYWRIGHT_TMPFS_CACHE_SIZE:-256m},uid=10001,gid=10001,mode=700"
    - "/home/10001/.config:size=${PLAYWRIGHT_TMPFS_CONFIG_SIZE:-64m},uid=10001,gid=10001,mode=700"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sirhosp}"
      POSTGRES_USER: "${POSTGRES_USER:-sirhosp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - sirhosp_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    <<: *app-service
    ports:
      - "${SIRHOSP_BIND_ADDRESS:-0.0.0.0}:${DJANGO_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  persistent_worker:
    <<: *playwright-service
    environment:
      <<: *app-environment
      SIRHOSP_WORKER_LABEL: persistent-worker
    command:
      - uv
      - run
      - --no-sync
      - python
      - manage.py
      - process_ingestion_runs_persistent_session
      - --loop
      - --sleep-seconds
      - "5"
      - --real-handle
      - --enable-real-queue

  census_orchestrator:
    <<: *playwright-service
    command:
      - uv
      - run
      - --no-sync
      - python
      - manage.py
      - run_adaptive_census_cycles
      - --loop

  summary_worker:
    <<: *app-service
    command:
      - uv
      - run
      - --no-sync
      - python
      - manage.py
      - process_summary_runs
      - --pipeline
      - --loop
      - --sleep-seconds
      - "5"

volumes:
  sirhosp_db_data:
    driver: local

networks:
  internal:
    driver: bridge
